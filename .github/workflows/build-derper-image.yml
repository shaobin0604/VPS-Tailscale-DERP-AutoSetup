# ============================================================
# 自动构建 & 推送 Tailscale DERP 镜像到 GHCR
#
# 触发:
#   1. 定时: 每周一 03:00 (UTC) 检查 tailscale 是否有新版本
#   2. 手动: 可在 Actions 页面手动运行 (workflow_dispatch)
#
# 说明: 不随项目打 tag (v*) 触发——镜像版本号跟随 Tailscale 官方版本，
#       与项目 VERSION 解耦，避免每次 push 项目版本都白打一次镜像。
#
# 行为:
#   - 通过 GitHub API 查询 tailscale 最新版本 tag
#   - 与当前镜像已发布版本对比，有新版才构建
#   - 构建 amd64 + arm64 双架构
#   - 推送 latest + 版本号 两个标签到 ghcr.io
#
# fork 说明:
#   1. 在 fork 仓库的 Settings → Actions 开启 Actions
#   2. 首次需手动运行一次 (workflow_dispatch)
#   3. 镜像会自动构建到你 fork 的 ghcr.io/<你的用户>/<仓库>/derper
# ============================================================
name: Build DERP image

on:
  schedule:
    # 每周一 03:00 UTC 检查 tailscale 新版本
    - cron: '0 3 * * 1'
  workflow_dispatch:   # 允许手动触发
    inputs:
      version:
        description: 'Tailscale 版本号（如 v1.102.3）。留空 = 自动检测最新版'
        required: false
        type: string

env:
  # 镜像名必须全小写（Docker/GHCR 强制），仓库名含大写需转小写
  # 通过下方 lowercase-image 步骤计算（兼容 fork 仓库自动适配）
  IMAGE_BASE: ghcr.io/${{ github.repository }}/derper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 计算小写镜像名（fork 自动适配）----------
      - name: Compute lowercase image name
        id: image
        run: |
          # 用 bash 参数展开把小写：${VAR,,} 转小写
          echo "image=$(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "calculated image: $(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')"

      # ---------- 构建时间戳（用于镜像标签）----------
      - name: Set build timestamp
        id: build_time
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ---------- 获取 tailscale 最新版本 ----------
      # 手动触发时优先使用用户输入的版本号；否则自动查询 tailscale 最新 release
      - name: Get latest tailscale version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            latest="${{ github.event.inputs.version }}"
            echo "使用手动指定版本: ${latest}"
          else
            # 通过 GitHub API 查询 tailscale/tailscale 最新 release
            latest=$(curl -sS -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/tailscale/tailscale/releases/latest \
              | jq -r .tag_name)
            echo "自动检测 tailscale 最新版本: ${latest}"
          fi
          # 归一化：去掉前导 v（如 v1.102.3 → 1.102.3），确保标签统一
          latest="${latest#v}"
          echo "version=v${latest}" >> "$GITHUB_OUTPUT"
          echo "最终构建版本: v${latest}"

      # ---------- 判断是否需要构建 ----------
      # 对比 ghcr 上已发布的版本，避免重复构建同一版本
      # 手动触发 (workflow_dispatch) 与 cron 走同一逻辑：版本已存在则跳过
      - name: Check if build needed
        id: check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          NEW_VER: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          # 校验版本格式（仅 vX.Y.Z 放行，X/Y/Z 必须是正整数）。
          # 防止任意输入注入 shell——只有仓库协作者能触发 workflow_dispatch，
          # 但仍需最小输入校验。
          if ! echo "${NEW_VER}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: 版本格式非法: ${NEW_VER}（必须严格匹配 vX.Y.Z，X/Y/Z 为正整数）" >&2
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 查询现有镜像的版本 tag（列出 ghcr 包，看是否已有该版本）
          #
          # ★ 必须带认证做 token 交换 ★
          # GHCR 的匿名 token 端点（/token?scope=repository:...:pull）对【包不存在】和
          # 【包私有】一律返回 403（不泄露存在性）。而 fork 首次构建时包必然还不存在，
          # 匿名查询 → 403 → 旧逻辑 exit 1 → 永远建不出包（鸡生蛋死锁）。
          # 所以用仓库自己的 GITHUB_TOKEN 做 Basic Auth 换 registry token：
          # 认证后 200=可读、403/404=包还不存在，后者按「需要构建」处理。
          REPO_PATH="${IMAGE#ghcr.io/}"
          TOKEN=""
          TOKEN_RESP="$(curl -sSL -u "${ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_PATH}:pull" 2>/dev/null || true)"
          TOKEN="$(printf '%s' "${TOKEN_RESP}" | jq -r '.token // empty' 2>/dev/null || true)"

          EXISTING=""
          if [ -n "${TOKEN}" ]; then
            HTTP_CODE="$(curl -sSL -o /tmp/ghcr-tags.json -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${REPO_PATH}/tags/list" 2>/dev/null || echo '000')"
            echo "tags/list HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              EXISTING="$(jq -r '.tags[]?' /tmp/ghcr-tags.json 2>/dev/null || true)"
            else
              echo "包尚不可匿名/认证读取（HTTP ${HTTP_CODE}），视为首次发布"
            fi
          else
            echo "WARN: 未能获取 GHCR registry token（token 响应: $(printf '%s' "${TOKEN_RESP}" | head -c 200)）"
            echo "WARN: 按「需要构建」继续——重复推同一版本是幂等的，宁可多构建也不阻塞首次发布"
          fi

          echo "镜像现有 tags: ${EXISTING:-<none>}"
          # 用 -x 全行精确匹配：避免 v1.104.7 命中 v1.104.70 这类前缀误判
          if printf '%s\n' "${EXISTING}" | grep -qxF "${NEW_VER}"; then
            echo "版本 ${NEW_VER} 已发布，无需重新构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 ${NEW_VER}，开始构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 构建并推送 ----------
      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.build_time.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}